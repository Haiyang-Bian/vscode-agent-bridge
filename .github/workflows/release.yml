name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
          # Keep the release build self-contained and deterministic on a clean runner.
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.11/bun-windows-x64-baseline.zip

      - name: Set up Node for vsce
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun run verify:release

      - name: Run complete release gates
        run: |
          bun run check
          bun run test:e2e:repeat
          bun run package:vsix
          bun run release:checksums
          bun run package:test-bundle
          bun run test:artifact

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-checksums: artifacts/SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: vscode-agent-bridge-${{ github.ref_name }}-windows-x64
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  marketplace:
    if: ${{ vars.MARKETPLACE_TRUSTED_PUBLISHING_ENABLED == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Node for trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install frozen publishing tool
        run: bun install --frozen-lockfile

      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          name: vscode-agent-bridge-${{ github.ref_name }}-windows-x64
          path: artifacts

      - name: Publish VSIX to Marketplace with OIDC
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          node node_modules/@vscode/vsce/vsce publish \
            --packagePath "artifacts/vscode-agent-bridge-${RELEASE_VERSION}-win32-x64.vsix" \
            --oidc

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          name: vscode-agent-bridge-${{ github.ref_name }}-windows-x64
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $releaseFiles = Get-ChildItem -LiteralPath artifacts -File | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @releaseFiles --verify-tag --title "VS Code Agent Bridge $releaseVersion" --notes-file "docs/releases/v$releaseVersion.md"
