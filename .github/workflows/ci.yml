name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
          # Run the baseline runtime itself so --target=bun-windows-x64-baseline
          # can reuse the current executable instead of downloading it mid-build.
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.11/bun-windows-x64-baseline.zip

      - name: Set up Node for vsce
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Check workspaces
        run: bun run check

      - name: Classify pull request test impact
        if: ${{ github.event_name == 'pull_request' }}
        id: impact
        shell: pwsh
        run: |
          $output = bun run test:plan -- --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --format github
          $output | Write-Host
          $output | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Run affected VS Code Extension Host E2E
        if: ${{ github.event_name == 'pull_request' }}
        run: bun run test:e2e:affected -- --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"

      - name: Run complete E2E twice on master
        if: ${{ github.event_name == 'push' }}
        run: bun run test:e2e:repeat

      - name: Package platform VSIX
        if: ${{ github.event_name == 'push' || steps.impact.outputs.artifact == 'true' }}
        run: bun run package:vsix

      - name: Create checksums
        if: ${{ github.event_name == 'push' || steps.impact.outputs.artifact == 'true' }}
        run: bun run release:checksums

      - name: Create cross-machine test bundle
        if: ${{ github.event_name == 'push' || steps.impact.outputs.artifact == 'true' }}
        run: bun run package:test-bundle

      - name: Smoke-test release artifacts
        if: ${{ github.event_name == 'push' || steps.impact.outputs.artifact == 'true' }}
        run: bun run test:artifact

      - name: Upload CI artifacts
        if: ${{ github.event_name == 'push' || steps.impact.outputs.artifact == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: vscode-agent-bridge-windows-x64
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
